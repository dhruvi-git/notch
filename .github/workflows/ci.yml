# Builds and tests every part of Notch on each push and pull request.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java modules (unit tests and search evaluation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test engine, guard, explain, API and CLI
        run: mvn -B -ntp verify
      - name: Keep the CLI jar
        uses: actions/upload-artifact@v4
        with:
          name: notch-cli
          path: cli/target/notch.jar

  live:
    name: Live API tests against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: notch
          POSTGRES_PASSWORD: notch
          POSTGRES_DB: notch
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U notch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5433/notch
      DATABASE_USER: notch
      DATABASE_PASSWORD: notch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: mvn -B -ntp -q install -DskipTests
      - name: Start the API
        run: |
          nohup java -jar api/target/notch-api-*.jar > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8090/actuator/health && exit 0
            sleep 2
          done
          echo "The API didn't start:"; cat api.log; exit 1
      - name: Walkthrough and cross-user isolation tests
        env:
          NOTCH_API_URL: http://localhost:8090
        run: mvn -B -ntp -pl api test -Dtest='WalkthroughSmokeTest,CrossUserIsolationTest' -Dsurefire.failIfNoSpecifiedTests=false
      - name: API log
        if: always()
        run: tail -n 200 api.log

  web:
    name: Web app (tests, build, type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run typecheck
