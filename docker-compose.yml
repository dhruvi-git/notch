# Local Postgres with the pgvector extension. Start with: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: notch
      POSTGRES_USER: notch
      POSTGRES_PASSWORD: notch
    ports:
      - "5433:5432"   # 5433 on your machine, so a locally installed PostgreSQL on 5432 can keep running
    volumes:
      - notch-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notch -d notch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  notch-db:
