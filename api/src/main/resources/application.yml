spring:
  application:
    name: notch-api
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/notch}
    username: ${DATABASE_USER:notch}
    password: ${DATABASE_PASSWORD:notch}
  servlet:
    multipart:
      # Code zips for Explain can be up to 25 MB; chat imports keep their own 5 MB limit (ImportService).
      max-file-size: 25MB
      max-request-size: 26MB
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health

notch:
  crypto:
    key: ${NOTCH_CRYPTO_KEY:}
  limits:
    imports-per-day: 20
    questions-per-day: 30
  cors:
    allowed-origins: ${NOTCH_CORS_ORIGINS:http://localhost:3000}
  # AI models. With no keys set, Notch runs fully offline. Private projects are never sent to either.
  llm:
    provider: ${NOTCH_LLM:auto}                     # auto: Claude when ANTHROPIC_API_KEY is set
    model: ${NOTCH_LLM_MODEL:claude-haiku-5-5}
    api-key: ${ANTHROPIC_API_KEY:}
  embedding:
    dimensions: 1024   # must match vector(1024) in the schema
    provider: ${NOTCH_EMBEDDINGS:auto}              # auto: Voyage when VOYAGE_API_KEY is set
    model: ${NOTCH_EMBEDDING_MODEL:voyage-4-lite}
    api-key: ${VOYAGE_API_KEY:}
  ingest:
    max-file-bytes: 5242880
    max-chunk-chars: 1200
  jobs:
    poll-delay-ms: 2000
  auth:
    state-secret: ${NOTCH_AUTH_SECRET:}
    session-days: 30
    dev-fallback: false   # true only in the local profile
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      callback-url: ${GITHUB_CALLBACK_URL:http://localhost:8090/auth/github/callback}
