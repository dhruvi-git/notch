spring:
  application:
    name: notch-api
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/notch}
    username: ${DATABASE_USER:notch}
    password: ${DATABASE_PASSWORD:notch}
  servlet:
    multipart:
      # Real chat exports (with images and audio) and code zips can be large; only what's needed
      # is read from them: conversations.json from an export, source files from a codebase.
      max-file-size: 100MB
      max-request-size: 101MB
  mvc:
    problemdetails:
      enabled: true

server:
  servlet:
    encoding:
      charset: UTF-8
      force-response: true   # JSON says charset=utf-8, so every client decodes it right
  port: ${PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health

notch:
  crypto:
    key: ${NOTCH_CRYPTO_KEY:}
  limits:
    imports-per-day: 20
    questions-per-day: 30
    captures-per-day: 200   # automatic capture: each sync or finished session counts once
  cors:
    allowed-origins: ${NOTCH_CORS_ORIGINS:http://localhost:3000}
  # AI models. With no keys set, Notch runs fully offline. Private projects are never sent to either.
  llm:
    provider: ${NOTCH_LLM:auto}                     # auto: Claude when ANTHROPIC_API_KEY is set
    model: ${NOTCH_LLM_MODEL:claude-haiku-5-5}
    effort: ${NOTCH_LLM_EFFORT:low}                 # blank for models without effort (Haiku 4.5 and older)
    api-key: ${ANTHROPIC_API_KEY:}
  embedding:
    dimensions: 1024   # must match vector(1024) in the schema
    provider: ${NOTCH_EMBEDDINGS:auto}              # auto: Voyage when VOYAGE_API_KEY is set
    model: ${NOTCH_EMBEDDING_MODEL:voyage-4-lite}
    api-key: ${VOYAGE_API_KEY:}
  ingest:
    max-file-bytes: 104857600   # 100 MB; an export's conversations.json may unzip to 64 MB
    max-chunk-chars: 1200
  jobs:
    poll-delay-ms: 2000
  auth:
    state-secret: ${NOTCH_AUTH_SECRET:}
    session-days: 30
    dev-fallback: false   # true only in the local profile
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      callback-url: ${GITHUB_CALLBACK_URL:http://localhost:8090/auth/github/callback}
    google:   # an OAuth client from Google Cloud (APIs & Services > Credentials), type "Web application"
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      callback-url: ${GOOGLE_CALLBACK_URL:http://localhost:8090/auth/google/callback}
